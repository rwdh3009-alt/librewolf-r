name: Build LibreWolf for Windows

# Se corre manualmente desde la pestaña "Actions" de GitHub, botón "Run workflow".
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    # Todo el job corre DENTRO de la imagen Docker oficial de LibreWolf para
    # Windows (así lo hace el propio CI de LibreWolf/bsys6). Esta imagen ya
    # trae todas las herramientas de cross-compilación necesarias en /root/.mozbuild.
    container:
      image: codeberg.org/librewolf/bsys6:windows
    timeout-minutes: 360

    steps:
      - name: Checkout de tu fork (con submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: librewolf-r

      - name: Instalar dependencias para generar el source tarball
        run: |
          apt-get update
          apt-get install -y make wget curl python3 rsync gnupg

      - name: Generar el source tarball de tu fork (make all)
        working-directory: librewolf-r
        run: |
          make all

      - name: Ubicar el tarball generado
        id: tarball
        working-directory: librewolf-r
        run: |
          TARBALL=$(ls librewolf-*.source.tar.gz | head -n1)
          echo "path=$(pwd)/$TARBALL" >> "$GITHUB_OUTPUT"
          echo "Tarball generado: $TARBALL"

      - name: Clonar bsys6 (sistema de build oficial de LibreWolf)
        run: |
          git clone https://codeberg.org/librewolf/bsys6.git /bsys6-repo

      - name: Compilar LibreWolf para Windows
        # SOURCE_TAR usa TU tarball (con tus overrides) en vez de descargar
        # el oficial. TARGET=windows ya viene implícito por la imagen, pero
        # lo dejamos explícito por seguridad. Excluimos msix y nupkg (esos
        # son para Microsoft Store / Chocolatey, no los necesitas para uso
        # personal) y nos quedamos con setup (instalador .exe) y portable.
        #
        # GitHub Actions fuerza HOME=/github/home dentro de contenedores y
        # no permite sobreescribirlo vía container.env (bug conocido de
        # actions/runner). El toolchain de Windows (MSVC/wine/etc) que trae
        # la imagen está instalado en /root/.mozbuild, así que exportamos
        # HOME=/root manualmente al inicio de este paso para que el build
        # lo encuentre ahí.
        env:
          TARGET: windows
          ARCH: x86_64
          SOURCE_TAR: ${{ steps.tarball.outputs.path }}
        run: |
          export HOME=/root
          cd /bsys6-repo
          ./bsys6 package setup portable

      - name: Ubicar los artifacts generados
        run: |
          echo "=== Buscando archivos .exe y .zip generados ==="
          find /bsys6-repo -maxdepth 2 \( -iname "*.exe" -o -iname "*.zip" \) -exec ls -la {} \;

      - name: Subir el instalador y la versión portable como artifacts
        uses: actions/upload-artifact@v4
        with:
          name: librewolf-r-windows
          path: |
            /bsys6-repo/*.exe
            /bsys6-repo/*.zip
          retention-days: 14
