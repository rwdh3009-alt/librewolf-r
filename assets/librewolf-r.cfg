/** LIBREWOLF-R — Ajustes personalizados
 * Este archivo se pega automáticamente al final del librewolf.cfg oficial
 * durante el build (ver scripts/librewolf-patches.py).
 * Como Firefox procesa el archivo de arriba hacia abajo y la última
 * definición de una preferencia gana, estas líneas sobreescriben
 * cualquier valor por defecto de LibreWolf que coincida.
 */

/** Letterboxing: agrega franjas negras para redondear el tamaño de
 * ventana y dificultar el fingerprinting por resolución de pantalla.
 * No afecta velocidad de carga (eso es cosa de la red Tor, que no usamos). */
defaultPref("privacy.resistFingerprinting.letterboxing", true);

/** Geolocalización: dejamos que los sitios puedan pedir permiso de
 * ubicación (la API sigue activa), pero el permiso por defecto es
 * "denegar" — así, cada sitio debe preguntar explícitamente y tú
 * decides ahí mismo si aceptar o no, igual que con las cookies. */
defaultPref("permissions.default.geo", 2);

/** Cookies de terceros: en vez de solo aislarlas (comportamiento por
 * defecto de LibreWolf/Firefox), las bloqueamos directamente. Si un
 * sitio las necesita para funcionar, seguirá mostrando el aviso normal
 * de cookies y tú decides ahí si aceptar o no para ese sitio en concreto. */
defaultPref("network.cookie.cookieBehavior", 1);

/** DNS-over-HTTPS (DoH): por defecto LibreWolf trae esto apagado
 * (network.trr.mode = 5), lo que significa que tus consultas DNS van
 * sin cifrar a través del DNS de tu router/ISP — quien esté en esa
 * red puede ver qué dominios visitas, aunque el resto de la conexión
 * sea HTTPS. Con modo 2 activamos DoH (usando el proveedor ya
 * configurado por LibreWolf, Quad9 sin filtrado) pero dejamos que
 * caiga de vuelta al DNS del sistema si el servidor DoH falla, para
 * que la navegación no se interrumpa. */
defaultPref("network.trr.mode", 2);

/** Procesos de contenido: por defecto Firefox/LibreWolf lanza hasta 8
 * procesos de contenido (uno puede repartirse entre varias pestañas).
 * Cada proceso extra tiene un costo base de RAM fijo, así que bajar
 * este límite reduce el consumo total de memoria. Bajamos a 5 en vez
 * del default de 8 — suficiente para tener varias pestañas activas
 * sin que compitan demasiado por el mismo proceso, sin llegar al
 * extremo de 1-2 que puede sentirse menos fluido al cambiar de pestaña. */
defaultPref("dom.ipc.processCount", 5);

/** Historial de pestañas cerradas: por defecto Firefox guarda en RAM
 * el estado completo de las últimas 25 pestañas cerradas (por si
 * quieres reabrirlas con Ctrl+Shift+T). Bajamos a 10 para liberar
 * algo de memoria, manteniendo margen suficiente para casos normales
 * de "cerré esto sin querer". */
defaultPref("browser.sessionstore.max_tabs_undo", 10);
